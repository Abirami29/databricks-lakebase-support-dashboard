command:
  - /bin/bash
  - -c
  - streamlit run app.py --server.port $PORT

env:
  - name: LAKEBASE_HOST
    valueFrom:
      secretKeyRef:
        scope: lakebase-secrets
        key: lakebase-host
  - name: LAKEBASE_PORT
    value: "5432"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  - name: LAKEBASE_USER
    value: "ticket-app-role"
  - name: LAKEBASE_PASSWORD
    valueFrom:
      secretKeyRef:
        scope: lakebase-secrets
        key: lakebase-password
command:
  - /bin/bash
  - -c
  - streamlit run app.py --server.port $PORT

env:
  - name: LAKEBASE_HOST
    value: ep-hidden-bread-d83qxt8s.database.us-east-2.cloud.databricks.com
  - name: LAKEBASE_PORT
    value: "5432"
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  - name: LAKEBASE_USER
    value: YOUR_ROLE_NAME_HERE
  - name: LAKEBASE_PASSWORD
    valueFrom:
      secretKeyRef:
        scope: lakebase-secrets
        key: lakebase-password